repositories {
maven {
  name = "Illusive Soulworks maven"
  url = "https://maven.theillusivec4.top/"
  }
}

dependencies {
  runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
  compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api"
}


repositories {
  exclusiveContent {
    forRepository {
      maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
      }
    }
    filter {
      includeGroupAndSubgroups('software.bernie.geckolib')
      includeGroupAndSubgroups('com.geckolib')
    }
  }
}

dependencies {
  implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2'
}


repositories {
  maven {
    name = 'LDLib2'
    url = 'https://maven.firstdark.dev/snapshots'
  }
  maven {
    name = 'LDLib2Releases'
    url = 'https://maven.firstdark.dev/releases'
  }
}

dependencies {
  // Runtime + compile: NeoForge moddev loads implementation mods into runClient
  implementation 'com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.29'
}


